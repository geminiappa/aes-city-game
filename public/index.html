<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">

<title>АЭС: Энергия Города</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


:root{

--bg:#05070d;
--panel:#101827;
--panel2:#162238;

--border:#243450;

--blue:#38bdf8;
--yellow:#fbbf24;
--green:#34d399;
--red:#ef4444;

--text:#e5e7eb;
--muted:#94a3b8;

}


body{

height:100vh;
width:100%;

background:#020306;

font-family:
Segoe UI,
Arial,
sans-serif;

color:var(--text);

overflow:hidden;

display:flex;
justify-content:center;

}




.app{

width:100%;
max-width:520px;

height:100vh;

background:var(--bg);

position:relative;

overflow:hidden;

}



.screen{

position:absolute;

inset:0;

display:none;

flex-direction:column;

}


.screen.active{

display:flex;

}




/* MENU */


.menu{

justify-content:center;

align-items:center;

padding:20px;

background:

radial-gradient(circle,
rgba(56,189,248,.15),
transparent 60%),

var(--bg);

}



.card{

width:100%;

background:

linear-gradient(
160deg,
#172338,
#080d18
);

border:1px solid var(--border);

border-radius:22px;

padding:25px;

}



.logo{

text-align:center;

font-size:34px;

font-weight:900;

background:

linear-gradient(
90deg,
#38bdf8,
#fbbf24
);

-webkit-background-clip:text;

color:transparent;

}



.subtitle{

text-align:center;

color:var(--muted);

margin:10px 0 20px;

}



.btn{

width:100%;

padding:15px;

margin-top:10px;

border-radius:14px;

border:1px solid var(--border);

background:#172338;

color:white;

font-size:15px;

font-weight:800;

}



.btn.primary{

background:

linear-gradient(
180deg,
#0ea5e9,
#0369a1
);

}



.btn.gold{

background:

linear-gradient(
180deg,
#fbbf24,
#d97706
);

color:#111;

}



/* PROFILE */


.profile{

display:flex;

align-items:center;

gap:12px;

background:#101827;

padding:12px;

border-radius:14px;

margin-bottom:15px;

}



.avatar{

width:45px;

height:45px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

background:#1e293b;

}





/* GAME */


#game{

background:#05070d;

}



.topbar{

height:65px;

display:flex;

align-items:center;

gap:8px;

padding:8px;

background:#101827;

border-bottom:1px solid var(--border);

}



.stat{

font-size:11px;

font-weight:800;

}



.stat span{

display:block;

font-size:16px;

}



.energy span{

color:var(--yellow);

}


.money span{

color:#4ade80;

}


.rb span{

color:#c084fc;

}





.scene{

height:38vh;

background:

radial-gradient(
circle,
rgba(251,191,36,.15),
transparent
);

border-bottom:2px solid var(--yellow);

}



#reactor{

width:100%;

height:100%;

}





.panel{

flex:1;

background:#0b1220;

overflow:auto;

}





.tabs{

display:flex;

background:#090f1b;

}


.tab{

flex:1;

padding:14px 5px;

background:none;

border:0;

color:#94a3b8;

font-weight:900;

font-size:11px;

}



.tab.active{

color:#fbbf24;

border-bottom:3px solid #fbbf24;

}



.content{

padding:12px;

}




.item{

display:flex;

align-items:center;

gap:12px;

padding:12px;

margin-bottom:10px;

border-radius:14px;

background:#131d31;

border:1px solid var(--border);

}



.item button{

margin-left:auto;

padding:10px;

border-radius:10px;

background:#fbbf24;

border:0;

font-weight:900;

}





/* LEADERBOARD */


.leader{

padding:15px;

}



.rank-card{

display:flex;

align-items:center;

gap:10px;

background:#131d31;

border:1px solid var(--border);

border-radius:14px;

padding:12px;

margin-bottom:8px;

}



.rank{

font-size:22px;

font-weight:900;

color:#fbbf24;

}



.back{

margin-top:15px;

}




@media(min-width:700px){

.app{

border-left:1px solid #243450;

border-right:1px solid #243450;

}

}


</style>


<style>
/* EXTRA MOBILE/PC ADAPTATION */
.app{min-height:100dvh}
@media(max-width:600px){
.topbar{height:58px}
.tab{font-size:10px;padding:12px 2px}
.item{min-height:70px}
.btn{min-height:50px}
}
@media(min-width:900px){
.app{height:95vh;margin-top:2.5vh;border-radius:24px;box-shadow:0 0 80px #000}
}

/* LOADING SCREEN */
#loading-screen{
position:absolute;inset:0;z-index:99999;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:radial-gradient(circle,#172554,#020617);
transition:opacity .8s;
}
.load-reactor{
font-size:70px;color:#fbbf24;
animation:pulseReactor 1.2s infinite;
}
.load-bar{width:260px;height:8px;background:#1e293b;border-radius:20px;overflow:hidden;margin-top:25px}
.load-fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#fbbf24);transition:.3s}
@keyframes pulseReactor{50%{transform:scale(1.15);text-shadow:0 0 40px #fbbf24}}
</style>

</head>


<body>


<div class="app">

<div id="loading-screen">
<div class="load-reactor">☢</div>
<h1>АЭС</h1>
<p>Запуск энергетической сети</p>
<div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
</div>



<!-- MENU -->

<div class="screen active menu" id="menu">


<div class="card">


<h1 class="logo">
АЭС
</h1>

<div class="subtitle">
ЭНЕРГИЯ ГОРОДА
</div>



<div class="profile">

<div class="avatar">
👷
</div>

<div>

Оператор

<br>

<span id="menuName">
Безымянный
</span>

</div>


</div>



<button class="btn primary"
onclick="openScreen('game')">

☢ Начать смену

</button>



<button class="btn gold"
onclick="openScreen('leaders')">

🏆 Таблица лидеров

</button>



<button class="btn">

⚙ Настройки

</button>


</div>


</div>
<!-- ИГРА -->

<div class="screen" id="game">


<div class="topbar">


<button class="btn"
style="width:40px;padding:8px"
onclick="openScreen('menu')">
←
</button>


<div class="stat energy">
⚡ Энергия
<span id="energy">
0
</span>
</div>


<div class="stat money">
💰 Деньги
<span id="money">
0
</span>
</div>


<div class="stat rb">
☢ Ребиты
<span id="rebirths">
0
</span>
</div>


</div>



<div class="scene">


<svg id="reactor"
viewBox="0 0 500 250">


<!-- фон -->

<rect width="500"
height="250"
fill="#070b14"/>



<!-- башни -->

<path d="
M80 210
Q100 80 140 210
"
fill="#334155"/>


<path d="
M160 210
Q180 80 220 210
"
fill="#334155"/>



<!-- реактор -->


<circle
cx="300"
cy="140"
r="60"
fill="#172554"
/>



<circle
cx="300"
cy="140"
r="30"
fill="#fbbf24"
>



<animate

attributeName="r"

values="30;38;30"

dur="1s"

repeatCount="indefinite"

/>


</circle>




<!-- турбина -->


<g transform="translate(400 150)">


<circle
r="35"
fill="#064e3b"
/>


<path d="
M0-30L10 0L0 30L-10 0Z
"
fill="#34d399">


<animateTransform

attributeName="transform"

type="rotate"

from="0"

to="360"

dur="2s"

repeatCount="indefinite"

/>


</path>


</g>



</svg>


</div>





<div class="panel">



<div class="tabs">


<button class="tab active"
onclick="showTab('upgrades')">

🔧 Улучшения

</button>


<button class="tab"
onclick="showTab('rebirth')">

☢ Ребиты

</button>


<button class="tab"
onclick="showTab('factory')">

🏭 Завод

</button>



</div>





<div class="content"
id="gameContent">


</div>



</div>



</div>






<!-- ЛИДЕРЫ -->


<div class="screen" id="leaders">


<div class="card leader">


<h2>
🏆 Таблица лидеров
</h2>



<div class="tabs">


<button class="tab active"
onclick="loadLeaderboard('rebirths')">

☢ Ребиты

</button>


<button class="tab"
onclick="loadLeaderboard('energy')">

⚡ Энергия

</button>


<button class="tab"
onclick="loadLeaderboard('money')">

💰 Деньги

</button>


</div>




<div id="leaderList">


Загрузка...


</div>



<button class="btn back"
onclick="openScreen('menu')">

← Назад

</button>


</div>


</div>
<script>


let userId = localStorage.getItem("aes_user_id");


if(!userId){

userId =
"user_"+Math.random().toString(36).slice(2);

localStorage.setItem(
"aes_user_id",
userId
);

}



let S={

energy:0,

money:0,

rebirths:0,

cityLevel:0,

lastTime:Date.now(),


upgrades:{


turbine:0,

generator:0,

ai:0,

reactor:0


},


profile:{


name:"Оператор"


}


};





const upgrades={


turbine:[

{
name:"Малая турбина",
cost:1000,
cps:20
},

{
name:"Паровая турбина",
cost:10000,
cps:250
},

{
name:"Ядерная турбина",
cost:100000,
cps:5000
}

],



generator:[

{
name:"Генератор",
cost:5000,
cps:100
},

{
name:"Усиленный генератор",
cost:50000,
cps:1500
},

{
name:"Квантовый генератор",
cost:1000000,
cps:50000
}

],



ai:[

{
name:"ИИ оператор",
cost:100000,
mult:2
},

{
name:"ИИ станция",
cost:1000000,
mult:5
}

]


};







function openScreen(id){

document.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));


document.getElementById(id)
.classList.add("active");


}





function fmt(n){

if(n>=1000000)

return (n/1000000).toFixed(1)+"M";


if(n>=1000)

return (n/1000).toFixed(1)+"K";


return Math.floor(n);

}






function stats(){


let cps=1;


Object.keys(S.upgrades)
.forEach(type=>{


let lvl=S.upgrades[type];


if(upgrades[type]){


for(let i=0;i<lvl;i++)

cps+=upgrades[type][i].cps||0;


}



});



return cps;


}







function update(){


document.getElementById("energy")
.textContent=fmt(S.energy);



document.getElementById("money")
.textContent=fmt(S.money);



document.getElementById("rebirths")
.textContent=S.rebirths;



render();


}








function render(){


let box=document.getElementById("gameContent");


box.innerHTML="";



Object.keys(upgrades).forEach(type=>{


let lvl=S.upgrades[type];


let next=upgrades[type][lvl];



if(next){


box.innerHTML+=`

<div class="item">


<div>

<b>${next.name}</b>

<br>

Цена:
${fmt(next.cost)}

</div>



<button onclick="buy('${type}')">

Купить

</button>



</div>

`;

}


});


}







function buy(type){


let lvl=S.upgrades[type];


let item=upgrades[type][lvl];


if(!item)
return;



if(S.energy>=item.cost){


S.energy-=item.cost;


S.upgrades[type]++;


save();


update();


}



}








// клик по станции


document
.getElementById("reactor")
.onclick=function(){


S.energy+=1;


S.money+=0.1;



update();


};










function showTab(name){


render();


}








async function save(){


S.lastTime=Date.now();



localStorage.setItem(
"aes_save",
JSON.stringify(S)
);



fetch("/api/save",{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

userId:userId,

saveData:S

})


});


}









async function load(){



let local=
localStorage.getItem("aes_save");



if(local)

S=Object.assign(
S,
JSON.parse(local)
);




try{


let r=await fetch(
"/api/save/"+userId
);



let j=await r.json();



if(j.data)

S=j.data;



}catch(e){}



}





async function loadLeaderboard(type){



let box=document.getElementById(
"leaderList"
);



box.innerHTML="Загрузка...";



let r=await fetch(
"/api/leaderboard/"+type
);



let j=await r.json();



box.innerHTML="";



j.data.forEach((p,i)=>{


box.innerHTML+=`

<div class="rank-card">


<div class="rank">

#${i+1}

</div>


<div>

<b>${p.username}</b>


<br>


☢ ${fmt(p.rebirths)}

&nbsp;

⚡ ${fmt(p.energy)}

&nbsp;

💰 ${fmt(p.money)}


</div>


</div>


`;


});


}








// пассивный доход


setInterval(()=>{


let cps=stats();


S.energy+=cps/10;


S.money+=cps/100;



update();


},100);







// автосохранение


setInterval(save,10000);








(async()=>{


await load();


update();


})();



</script>
<script>


// ================= РЕБИТЫ =================


function doRebirth(){


let need = 1000000 * (S.rebirths+1);



if(S.energy < need){

alert(
"Нужно ⚡ "+fmt(need)
);

return;

}



if(confirm(
"Сделать ребит?\nЭнергия и улучшения сбросятся."
)){


S.rebirths++;


S.energy=0;


S.upgrades={

turbine:0,

generator:0,

ai:0,

reactor:0

};



S.money+=10000;



save();

update();


alert(
"☢ Ребит выполнен!"
);


}



}







// ================= ОФЛАЙН ДОХОД =================



function offlineReward(){


let now=Date.now();


let diff=(now-S.lastTime)/1000;



if(diff>60){


let reward=
Math.floor(
stats()*diff
);



S.energy+=reward;



alert(

"⚡ Пока вас не было:\n+"+
fmt(reward)+
" энергии"

);



}



S.lastTime=now;



}










// ================= РАНГИ =================



function getRank(){



if(S.rebirths>=50)

return "👑 Архитектор АЭС";


if(S.rebirths>=20)

return "⭐ Главный инженер";


if(S.rebirths>=10)

return "🔧 Старший оператор";


if(S.rebirths>=5)

return "⚛ Инженер";


return "👷 Оператор";



}







// ================= ГОРОД =================



function updateCity(){


let lvl=Math.floor(
Math.log10(
S.energy+10
)
);



if(lvl>S.cityLevel){


S.cityLevel=lvl;


alert(

"🏙 Город вырос!\nУровень "+
lvl

);


}


}







// ================= БАТАРЕИ =================


let battery={

level:0,

max:1000

};



function chargeBattery(){


let add=Math.min(

S.energy,

battery.max

);



S.energy-=add;


battery.level+=add;



}





function useBattery(){


S.energy+=battery.level;


battery.level=0;


}





// ================= НОВЫЕ ЗАВОДЫ =================



const factories=[


{

name:"☢ Плазменный реактор",

bonus:50000,

cost:5000000

},


{

name:"🌎 Орбитальная станция",

bonus:500000,

cost:50000000

},


{

name:"🚀 Колония Марса",

bonus:5000000,

cost:500000000

}


];



function buyFactory(id){


let f=factories[id];


if(S.money>=f.cost){


S.money-=f.cost;


S.energy+=f.bonus;


alert(
f.name+" построен!"
);


save();

update();


}



}






// ================= АНИМАЦИЯ СТАНЦИИ =================



let power=0;


setInterval(()=>{


power++;


let reactor=document
.querySelector("#reactor circle");



if(reactor){


reactor.style.opacity=
0.5+
Math.sin(power/5)*0.5;


}



},100);







// ================= ЗАПУСК =================



window.addEventListener(
"load",
()=>{


offlineReward();


updateCity();


update();


}

);




</script>

<script>
// Extended systems

if(!S.money) S.money=0;
if(!S.factory) S.factory=[];
if(!S.upgrades.generator) S.upgrades.generator=0;

const EXTRA_UPGRADES={
generator:[
{name:"🔋 Генератор",cost:5000,cps:100},
{name:"⚡ Термогенератор",cost:50000,cps:1500},
{name:"☢ Квантовый генератор",cost:1000000,cps:50000}
],
factory:[
{name:"🏭 Завод",cost:100000,bonus:10000},
{name:"🌆 Энергоцентр",cost:1000000,bonus:200000}
]
};

async function loadLeaderboard(type="money"){
let box=document.getElementById("leaderList");
if(!box)return;
try{
let r=await fetch("/api/leaderboard/"+type);
let j=await r.json();
box.innerHTML="";
(j.data||[]).forEach((p,i)=>{
box.innerHTML+=`<div class="rank-card">
<div class="rank">#${i+1}</div>
<div>${p.username||"Оператор"}<br>
☢ ${p.rebirths||0}
⚡ ${fmt(p.energy||0)}
💰 ${fmt(p.money||0)}
</div></div>`;
});
}catch(e){
box.innerHTML="Ошибка загрузки";
}
}

function addMoney(){
S.money+=stats()/50;
}

setInterval(()=>{
addMoney();
update();
},1000);

window.addEventListener("load",()=>{
let p=0;
let t=setInterval(()=>{
p+=20;
let f=document.getElementById("load-fill");
if(f)f.style.width=p+"%";
if(p>=100){
clearInterval(t);
let l=document.getElementById("loading-screen");
if(l){
l.style.opacity=0;
setTimeout(()=>l.remove(),800);
}
}
},200);
});
</script>
